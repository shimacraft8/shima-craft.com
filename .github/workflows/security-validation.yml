name: Security change validation (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck && npm run test:unit -- --maxWorkers=1 && npm run lint && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: '1'
      - run: npm ci --ignore-scripts --no-fund && npm run web:build
        working-directory: amami-life
      - run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
        working-directory: amami-life
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: homepage-candidate-${{ github.sha }}
          path: amami-life/dist/release
          retention-days: 7
          if-no-files-found: error
