<!doctype html>
<html lang="ja" data-theme-mode="ink-only">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#222522" />
    <meta
      name="description"
      content="SHIMA CRAFTのトップ組み込み案。AMAMI LIFEで奄美の今日を知る、旅と暮らしの道具。ローカル確認専用。"
    />
    <title>SHIMA CRAFT × AMAMI LIFE — トップページ案</title>
    <link rel="stylesheet" href="/theme-tokens.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://cyberjapandata.gsi.go.jp" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="/leaflet.css" />
    <link rel="stylesheet" href="/shimacraft.css" />
    <link rel="stylesheet" href="/apple-refinement.css" />
    <script type="module" src="/app.js"></script>
    <script type="module" src="/shimacraft.js"></script>
  </head>
  <body data-theme="ink">
    <a class="skip" href="#content">本文へ進む</a>
    <header class="craft-header">
      <a class="craft-wordmark" href="#today" aria-label="SHIMA CRAFT 島の今日へ"><img class="craft-logo" src="/assets/shimacraft-logo-white-red.svg" width="480" height="206" alt="SHIMA CRAFT" /></a>
    </header>
    <div class="showroom">
      <div class="island-intro">
        <div><p class="overline">AMAMI LIFE</p><p class="island-intro-title">島の今日を、ひと目で<span class="red-dot">。</span></p><p class="island-intro-copy">旅する人にも、ここで暮らす人にも。</p></div>
      </div>
      <div class="device">
        <div class="app-shell">
          <header class="app-header">
            <a href="#today" aria-label="AMAMI LIFE 今日へ" class="wordmark"
              >AMAMI<span>LIFE</span></a
            ><button
              id="location-button"
              class="location"
              aria-haspopup="dialog"
            >
              名瀬小湊 <span aria-hidden="true">⌄</span>
            </button>
          </header>
          <div class="demo-strip">
            気象庁の観測・予報を加工表示。防災は公式発表へ。
          </div>
          <nav id="tabs" class="tabbar" aria-label="主要画面"></nav>
          <main id="content" tabindex="-1"></main>
        </div>
      </div>
    </div>
    <footer class="craft-page-footer"><p>島の魅力を、伝わるかたちに。<small>SHIMA CRAFT · AMAMI ŌSHIMA</small></p><nav aria-label="SHIMA CRAFTの制作案内"><a href="https://shima-craft.com/#service">ホームページ制作・写真・映像 <span aria-hidden="true">↗</span></a><a href="https://shima-craft.com/#contact">SHIMA CRAFTに相談する <span aria-hidden="true">↗</span></a></nav></footer>
    <svg class="sky-map-filter" width="0" height="0" aria-hidden="true" focusable="false"><defs><filter id="island-map-tone" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="2 0 -1.6 0 .15 1.8 0 -1.5 0 .22 1.4 0 -1.2 0 .23 0 0 0 1 0"/></filter></defs></svg>
    <dialog id="cyclone-track-dialog" aria-labelledby="cyclone-track-title"></dialog>
    <dialog id="sky-map-dialog" aria-labelledby="sky-large-title"></dialog>
    <dialog id="cyclone-image-dialog" aria-labelledby="cyclone-image-title"><form method="dialog"><div class="dialog-head"><h2 id="cyclone-image-title">気象庁の実況天気図</h2><button value="cancel" aria-label="天気図を閉じる">×</button></div></form><div id="cyclone-large-image"></div></dialog>
    <dialog id="area-dialog" aria-labelledby="area-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="area-title">表示する地域</h2>
          <button value="cancel" aria-label="閉じる">×</button>
        </div>
        <p>
          位置情報の許可なしで選べます。<br />潮汐予測は名瀬小湊O9のみ対応しています。
        </p>
        <div id="area-options"></div>
      </form>
    </dialog>
    <dialog id="call-dialog" aria-labelledby="call-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="call-title">電話をかける</h2>
          <button value="cancel" aria-label="閉じる">×</button>
        </div>
        <p id="call-description"></p>
        <p>日本国内の緊急番号です。</p>
        <a id="call-link" class="primary" href="tel:119">電話アプリを開く</a>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
