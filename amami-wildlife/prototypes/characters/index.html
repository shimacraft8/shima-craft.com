</style><header><small>AMAMI WILDLIFE / CHARACTER STUDY</small><h1>森と同じ世界の生き物へ</h1><p>画像ではなく立体のブロックモデル　ドラッグや矢印キーで回転できます</p><button id="preview-motion" type="button" aria-pressed="false">動きを止める</button></header><main><article><div class="model" id="amami-rabbit" data-name="アマミノクロウサギ"></div><h2>アマミノクロウサギ</h2><p>黒褐色の体と短い耳　丸い体つきと短い手足を残す</p><nav aria-label="クロウサギの角度"><button data-angle="-.8">左から</button><button data-angle="-.15">正面</button><button data-angle="1.1">右から</button></nav></article><article><div class="model" id="green-turtle" data-name="アオウミガメ"></div><h2>アオウミガメ</h2><p>小さな頭と丸い甲羅　前の長いひれ2枚と後ろの短いひれ2枚</p><nav aria-label="アオウミガメの角度"><button data-angle="-.8">左から</button><button data-angle="-.15">正面</button><button data-angle="1.1">右から</button></nav></article></main><p class="caption">造形の方向性を確認する試作　実際の写真を参照した簡略化モデルです</p><script type="module" src="./preview.js"></script></html>
